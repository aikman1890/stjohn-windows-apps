name: Build and publish to Microsoft Store

# Builds all four St. John Pictures apps with the winapp CLI on GitHub's free
# Windows runners, packages each as MSIX, and submits to the Microsoft Store.
# Runs on every push to main that touches an app (or this workflow), plus manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'daypilot/**'
      - 'bizpilot/**'
      - 'wuse/**'
      - 'claimpilot/**'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:

jobs:setup-winapp
  build-and-publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: daypilot
            csproj: daypilot/DayPilot.csproj
            store_id_secret: DAYPILOT_STORE_ID
          - dir: bizpilot
            csproj: bizpilot/BizPilot.csproj
            store_id_secret: BIZPILOT_STORE_ID
          - dir: wuse
            csproj: wuse/Wuse.csproj
            store_id_secret: WUSE_STORE_ID
          - dir: claimpilot
            csproj: claimpilot/ClaimPilot.csproj
            store_id_secret: CLAIMPILOT_STORE_ID
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up winapp CLI
        uses: microsoft/setup-winapp@v1

      - name: Publish app
        run: dotnet publish ${{ matrix.csproj }} -r win-x64 -c Release -o ./publish/${{ matrix.dir }}

      - name: Package MSIX (Store certificate via Partner Center association)
        run: winapp pack ./publish/${{ matrix.dir }} --manifest ${{ matrix.dir }}/Package.appxmanifest --output ./${{ matrix.dir }}.msix

      - name: Configure Store credentials
        run: winapp store reconfigure --tenantId "${{ secrets.STORE_TENANT_ID }}" --sellerId "${{ secrets.STORE_SELLER_ID }}" --clientId "${{ secrets.STORE_CLIENT_ID }}" --clientSecret "${{ secrets.STORE_CLIENT_SECRET }}"

      - name: Publish to Microsoft Store
        run: winapp store publish ./${{ matrix.dir }}.msix --appId "${{ secrets[matrix.store_id_secret] }}"
